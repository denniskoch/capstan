name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Every push to main is edge: the current tip, not a release.
            type=edge,branch=main

            # A v1.2.3 tag publishes 1.2.3, 1.2 and 1, so a deployment can
            # pin as tightly or loosely as it wants.
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}

            # `latest` means "newest release", never "newest commit", and never
            # a prerelease. Declared here rather than as a second push so that
            # latest and the semver tags resolve to the *same* manifest digest
            # — a separate build would be byte-identical but not provably the
            # same artifact.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}

            # Immutable handle for a specific build, for pinning a rollback.
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=capstan
            org.opencontainers.image.description=Authenticating TLS front door for a Docker host's socket
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
